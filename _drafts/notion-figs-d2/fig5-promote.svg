<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8177"/></marker>
<marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9e8f"/></marker>
</defs>
<style>
text { font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#3b3630; }
.t { font-size:15px; } .s { font-size:12.5px; } .b { font-weight:700; } .h { font-size:18px; font-weight:700; }
.m { font-family:Consolas,'Cascadia Mono',monospace; }
.march { stroke-dasharray:6 6; animation: march .9s linear infinite; }
@keyframes march { to { stroke-dashoffset:-12; } }
.blink { animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.35; } }

.travel { animation: travel 5s ease-in-out infinite; }
@keyframes travel { 0%,15% { transform: translateX(0); } 55%,85% { transform: translateX(380px); } 100% { transform: translateX(0); } }
</style>
<rect width="760" height="348" fill="#fffdf9"/>
<text x="380" y="28" text-anchor="middle" class="h">「한 번 만들고, 여러 환경(staging, production)에 그대로 보낸다」</text><text x="24" y="62" text-anchor="start" class="t b">다시 빌드 (승격 이전 방식)</text><g class=""><rect x="40" y="76" width="250" height="66" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="165.0" y="104.5" text-anchor="middle" class="t b">staging 상자</text><text x="165.0" y="123.5" text-anchor="middle" class="s m">지문 64c25be3bf9d…</text></g><g class="blink"><rect x="430" y="76" width="290" height="66" rx="9" fill="#fbefd5" stroke="#e8a33d" stroke-width="2"/><text x="575.0" y="104.5" text-anchor="middle" class="t b">production 상자 (머지 때 새로 빌드)</text><text x="575.0" y="123.5" text-anchor="middle" class="s m">지문 6d29e8d854f1…</text></g><text x="360" y="114" text-anchor="middle" class="h">≠</text><text x="24" y="196" text-anchor="start" class="t b">승격 (지금: 새로 만들지 않고 그대로 보냄)</text><g class=""><rect x="40" y="212" width="250" height="66" rx="9" fill="#f4f1ec" stroke="#8a8177" stroke-width="2" stroke-dasharray="5 4"/><text x="165.0" y="240.5" text-anchor="middle" class="t b">staging</text><text x="165.0" y="259.5" text-anchor="middle" class="s"></text></g><g class=""><rect x="430" y="212" width="290" height="66" rx="9" fill="#f4f1ec" stroke="#8a8177" stroke-width="2" stroke-dasharray="5 4"/><text x="575.0" y="240.5" text-anchor="middle" class="t b">production</text><text x="575.0" y="259.5" text-anchor="middle" class="s"></text></g><g class="travel"><rect x="60" y="222" width="210" height="46" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2.5"/><text x="165" y="241" text-anchor="middle" class="s b">같은 상자</text><text x="165" y="258" text-anchor="middle" class="s m">64c25be3bf9d…</text></g><text x="380" y="312" text-anchor="middle" class="s b">오늘 production(리비전 00011-vgr)과 staging(00009-cbp)의 다이제스트가 64자리 모두 같았다 = 61e4310e0460…</text><text x="380" y="334" text-anchor="middle" class="s">※ 위쪽 지문 값은 옛 production 이미지(소스 배포)의 앞 12자리입니다.</text>
</svg>