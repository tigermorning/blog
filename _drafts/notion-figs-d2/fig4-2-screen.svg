.hl0 { animation: hl 7.5s ease-in-out 0.0s infinite; }.hl1 { animation: hl 7.5s ease-in-out 1.2s infinite; }.hl2 { animation: hl 7.5s ease-in-out 2.4s infinite; }.hl3 { animation: hl 7.5s ease-in-out 3.5999999999999996s infinite; }
