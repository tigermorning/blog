<rect width="760" height="720" fill="#fffdf9"/>
<text x="380" y="46" text-anchor="middle" class="h">화면의 v 값은 이렇게 생긴다</text><g class="hl0"><rect x="60" y="78" width="640" height="108" rx="14" fill="#f4f1ec" stroke="#8a8177" stroke-width="3"/><text x="380" y="114" text-anchor="middle" class="t b">① index.html에 미리 적어 둔 자리 표시</text><text x="380" y="160" text-anchor="middle" class="m b">var v='__COMMIT__'</text></g><line x1="380" y1="190" x2="380" y2="226" stroke="#e8a33d" stroke-width="4" class="march" marker-end="url(#ahA)"/><g class="hl1"><rect x="60" y="232" width="640" height="132" rx="14" fill="#fbefd5" stroke="#e8a33d" stroke-width="3"/><text x="380" y="270" text-anchor="middle" class="t b">② 배포할 때 sed가 글자를 바꾼다</text><text x="380" y="308" text-anchor="middle" class="t">__COMMIT__ → 커밋 앞 7자리</text><text x="380" y="346" text-anchor="middle" class="s">(글자 교체 명령 = sed)</text></g><line x1="380" y1="368" x2="380" y2="404" stroke="#1f9e8f" stroke-width="4" class="march" marker-end="url(#ahT)"/><g class="hl2"><rect x="60" y="410" width="640" height="108" rx="14" fill="#dff3f0" stroke="#1f9e8f" stroke-width="3"/><text x="380" y="446" text-anchor="middle" class="t b">③ 이미지 안에 들어간 파일</text><g class="swap1"><text x="380" y="494" text-anchor="middle" class="m b">var v='__COMMIT__'</text></g><g class="swap2"><text x="380" y="494" text-anchor="middle" class="m b">var v='92d2c86'</text></g></g><line x1="380" y1="522" x2="380" y2="558" stroke="#1f9e8f" stroke-width="4" class="march" marker-end="url(#ahT)"/><g class="hl3"><rect x="60" y="564" width="640" height="132" rx="14" fill="#ffffff" stroke="#1f9e8f" stroke-width="4"/><rect x="60" y="564" width="640" height="40" rx="14" fill="#dff3f0" stroke="#1f9e8f" stroke-width="4"/><text x="380" y="592" text-anchor="middle" class="t b">④ 앱 화면 (구석)</text><rect x="256" y="624" width="248" height="56" rx="12" fill="#dff3f0" stroke="#1f9e8f" stroke-width="3"/><text x="380" y="662" text-anchor="middle" class="m b">v 92d2c86</text></g>
