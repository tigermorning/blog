<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8177"/></marker>
<marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9e8f"/></marker>
</defs>
<style>
text { font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#3b3630; }
.t { font-size:15px; } .s { font-size:12.5px; } .b { font-weight:700; } .h { font-size:18px; font-weight:700; }
.m { font-family:Consolas,'Cascadia Mono',monospace; }
.march { stroke-dasharray:6 6; animation: march .9s linear infinite; }
@keyframes march { to { stroke-dashoffset:-12; } }
.blink { animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.35; } }
.hl0 { animation: hl 7.5s ease-in-out 0.0s infinite; }.hl1 { animation: hl 7.5s ease-in-out 1.0s infinite; }.hl2 { animation: hl 7.5s ease-in-out 2.0s infinite; }.hl3 { animation: hl 7.5s ease-in-out 3.0s infinite; }.hl4 { animation: hl 7.5s ease-in-out 4.0s infinite; }
@keyframes hl { 0%,14% { opacity:1; } 18%,86% { opacity:.4; } 100% { opacity:1; } }
</style>
<rect width="760" height="324" fill="#fffdf9"/>
<text x="380" y="28" text-anchor="middle" class="h">연결표: 커밋에서 화면까지 한 줄로 잇는다 (production, 오늘 확인한 값)</text><g class="hl0"><rect x="20" y="80" width="124" height="96" rx="9" fill="#f4f1ec" stroke="#8a8177" stroke-width="2.5"/><text x="82.0" y="123.5" text-anchor="middle" class="t b">커밋 SHA</text><text x="82.0" y="142.5" text-anchor="middle" class="s m">92d2c86647dd…</text></g><text x="82" y="202" text-anchor="middle" class="s">어디서 보나</text><text x="82" y="220" text-anchor="middle" class="s b">GitHub 커밋</text><g class="hl1"><rect x="169" y="80" width="124" height="96" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2.5"/><text x="231.0" y="123.5" text-anchor="middle" class="t b">이미지 태그</text><text x="231.0" y="142.5" text-anchor="middle" class="s m">92d2c86647dd…</text></g><text x="231" y="202" text-anchor="middle" class="s">어디서 보나</text><text x="231" y="220" text-anchor="middle" class="s b">Artifact Registry</text><g class="hl2"><rect x="318" y="80" width="124" height="96" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2.5"/><text x="380.0" y="123.5" text-anchor="middle" class="t b">다이제스트</text><text x="380.0" y="142.5" text-anchor="middle" class="s m">61e4310e0460…</text></g><text x="380" y="202" text-anchor="middle" class="s">어디서 보나</text><text x="380" y="220" text-anchor="middle" class="s b">리비전 상세 · AR</text><g class="hl3"><rect x="467" y="80" width="124" height="96" rx="9" fill="#fbefd5" stroke="#e8a33d" stroke-width="2.5"/><text x="529.0" y="123.5" text-anchor="middle" class="t b">리비전</text><text x="529.0" y="142.5" text-anchor="middle" class="s m">…-00011-vgr</text></g><text x="529" y="202" text-anchor="middle" class="s">어디서 보나</text><text x="529" y="220" text-anchor="middle" class="s b">Cloud Run</text><g class="hl4"><rect x="616" y="80" width="124" height="96" rx="9" fill="#fbefd5" stroke="#e8a33d" stroke-width="2.5"/><text x="678.0" y="123.5" text-anchor="middle" class="t b">화면</text><text x="678.0" y="142.5" text-anchor="middle" class="s m">v 92d2c86</text></g><text x="678" y="202" text-anchor="middle" class="s">어디서 보나</text><text x="678" y="220" text-anchor="middle" class="s b">앱을 열면 보임</text><line x1="146" y1="128" x2="167" y2="128" stroke="#1f9e8f" stroke-width="2.4" class="march" marker-end="url(#ahT)"/><line x1="295" y1="128" x2="316" y2="128" stroke="#1f9e8f" stroke-width="2.4" class="march" marker-end="url(#ahT)"/><line x1="444" y1="128" x2="465" y2="128" stroke="#1f9e8f" stroke-width="2.4" class="march" marker-end="url(#ahT)"/><line x1="593" y1="128" x2="614" y2="128" stroke="#1f9e8f" stroke-width="2.4" class="march" marker-end="url(#ahT)"/><text x="380" y="258" text-anchor="middle" class="s">커밋 SHA(코드의 지문)를 태그 이름으로 쓰고, 다이제스트(이미지 내용의 지문)는 내용에서 계산된다</text><text x="380" y="278" text-anchor="middle" class="s">리비전이 그 다이제스트로 이미지를 고정하고, 화면에는 커밋 앞 7자리가 새겨진다</text><text x="380" y="304" text-anchor="middle" class="s b">다섯 칸이 같은 커밋을 가리키면 「지금 production 코드는 어느 커밋인가」에 화면 몇 개로 답할 수 있다</text>
</svg>