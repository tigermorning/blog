<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8177"/></marker>
<marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9e8f"/></marker>
</defs>
<style>
text { font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#3b3630; }
.t { font-size:15px; } .s { font-size:12.5px; } .b { font-weight:700; } .h { font-size:18px; font-weight:700; }
.m { font-family:Consolas,'Cascadia Mono',monospace; }
.march { stroke-dasharray:6 6; animation: march .9s linear infinite; }
@keyframes march { to { stroke-dashoffset:-12; } }
.blink { animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.35; } }

.g-del { animation: gdel 9s ease-in-out infinite; }
.g-keep { animation: gkeep 9s ease-in-out infinite; }
.g-gone { animation: ggone 9s ease-in-out infinite; }
@keyframes gdel { 0%,10% { stroke-width:2; } 22%,40% { stroke-width:5; } 50%,100% { stroke-width:2; } }
@keyframes gkeep { 0%,45% { opacity:1; } 55%,70% { opacity:.55; } 80%,100% { opacity:1; } }
@keyframes ggone { 0%,70% { opacity:1; } 85%,100% { opacity:.12; } }
</style>
<rect width="760" height="322" fill="#fffdf9"/>
<text x="380" y="28" text-anchor="middle" class="h">정리 정책: 「7일보다 오래된 건 삭제」 + 「최근 10개는 유지」, 둘에 걸리면 유지</text><text x="380" y="54" text-anchor="middle" class="s">예: 이미지 15개 중 6개가 7일보다 오래됨 (노드 퀴즈)</text><text x="24" y="88" text-anchor="start" class="s">오래된 쪽 ← → 최근</text><g class="g-gone"><rect class="g-del" x="28" y="100" width="40" height="54" rx="7" fill="#f4f1ec" stroke="#e8a33d" stroke-width="2"/><text x="48.0" y="132" text-anchor="middle" class="s b">1</text></g><g class="g-gone"><rect class="g-del" x="75" y="100" width="40" height="54" rx="7" fill="#f4f1ec" stroke="#e8a33d" stroke-width="2"/><text x="95.0" y="132" text-anchor="middle" class="s b">2</text></g><g class="g-gone"><rect class="g-del" x="122" y="100" width="40" height="54" rx="7" fill="#f4f1ec" stroke="#e8a33d" stroke-width="2"/><text x="142.0" y="132" text-anchor="middle" class="s b">3</text></g><g class="g-gone"><rect class="g-del" x="169" y="100" width="40" height="54" rx="7" fill="#f4f1ec" stroke="#e8a33d" stroke-width="2"/><text x="189.0" y="132" text-anchor="middle" class="s b">4</text></g><g class="g-gone"><rect class="g-del" x="216" y="100" width="40" height="54" rx="7" fill="#f4f1ec" stroke="#e8a33d" stroke-width="2"/><text x="236.0" y="132" text-anchor="middle" class="s b">5</text></g><g class=""><rect class="g-del" x="263" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#e8a33d" stroke-width="2"/><text x="283.0" y="132" text-anchor="middle" class="s b">6</text></g><g class=""><rect class="" x="310" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="330.0" y="132" text-anchor="middle" class="s b">7</text></g><g class=""><rect class="" x="357" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="377.0" y="132" text-anchor="middle" class="s b">8</text></g><g class=""><rect class="" x="404" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="424.0" y="132" text-anchor="middle" class="s b">9</text></g><g class=""><rect class="" x="451" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="471.0" y="132" text-anchor="middle" class="s b">10</text></g><g class=""><rect class="" x="498" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="518.0" y="132" text-anchor="middle" class="s b">11</text></g><g class=""><rect class="" x="545" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="565.0" y="132" text-anchor="middle" class="s b">12</text></g><g class=""><rect class="" x="592" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="612.0" y="132" text-anchor="middle" class="s b">13</text></g><g class=""><rect class="" x="639" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="659.0" y="132" text-anchor="middle" class="s b">14</text></g><g class=""><rect class="" x="686" y="100" width="40" height="54" rx="7" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="706.0" y="132" text-anchor="middle" class="s b">15</text></g><g class=""><rect x="28" y="178" width="292" height="44" rx="9" fill="#fbefd5" stroke="#e8a33d" stroke-width="2"/><text x="174.0" y="205.0" text-anchor="middle" class="s b">삭제 조건: 7일 넘음 → 1~6번 (노랑 테두리)</text></g><g class="g-keep"><rect x="340" y="178" width="392" height="44" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="536.0" y="205.0" text-anchor="middle" class="s b">유지 조건: 최근 10개 → 6~15번 (초록)</text></g><text x="380" y="258" text-anchor="middle" class="t b">6번은 두 조건에 모두 걸림 → 유지.  지워지는 것은 1~5번 = 5개</text><text x="380" y="284" text-anchor="middle" class="s">오늘 실제 상태: 두 저장소에 정책 2개를 --dry-run으로 적용 (실제 삭제 없음, 후보 0개로 계산, 결과는 하루 뒤 감사 로그)</text><text x="380" y="306" text-anchor="middle" class="s">※ 「최근 10개」는 저장소 전체가 아니라 패키지(이미지 이름)마다 센다 (공식 문서)</text>
</svg>