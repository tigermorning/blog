<rect width="760" height="330" fill="#fffdf9"/>
<text x="380" y="28" text-anchor="middle" class="h">이전 노드는 GCP가 자동으로, 이번 노드는 GitHub가 직접 이미지(상자)를 만든다</text><text x="24" y="62" text-anchor="start" class="t b">이전 노드 (source: .)  GCP가 만든다</text><g class=""><rect x="18" y="76" width="150" height="62" rx="9" fill="#f4f1ec" stroke="#8a8177" stroke-width="2"/><text x="93.0" y="102.5" text-anchor="middle" class="t b">소스 코드</text><text x="93.0" y="121.5" text-anchor="middle" class="s">통째로 넘김</text></g><g class=""><rect x="186" y="76" width="140" height="62" rx="9" fill="#fbefd5" stroke="#e8a33d" stroke-width="2"/><text x="256.0" y="102.5" text-anchor="middle" class="t b">Cloud Build</text><text x="256.0" y="121.5" text-anchor="middle" class="s">GCP가 상자를 만듦</text></g><g class=""><rect x="346" y="76" width="205" height="62" rx="9" fill="#fbefd5" stroke="#e8a33d" stroke-width="2"/><text x="448.5" y="102.5" text-anchor="middle" class="t b">cloud-run-source-deploy</text><text x="448.5" y="121.5" text-anchor="middle" class="s">자동 저장소 · 태그 없음</text></g><g class=""><rect x="572" y="76" width="170" height="62" rx="9" fill="#f4f1ec" stroke="#8a8177" stroke-width="2"/><text x="657.0" y="102.5" text-anchor="middle" class="t b">Cloud Run</text><text x="657.0" y="121.5" text-anchor="middle" class="s">서비스</text></g><line x1="170" y1="107" x2="183" y2="107" stroke="#8a8177" stroke-width="2.4" class="march" marker-end="url(#ah)"/><line x1="328" y1="107" x2="343" y2="107" stroke="#8a8177" stroke-width="2.4" class="march" marker-end="url(#ah)"/><line x1="553" y1="107" x2="569" y2="107" stroke="#8a8177" stroke-width="2.4" class="march" marker-end="url(#ah)"/><text x="24" y="200" text-anchor="start" class="t b">이번 노드 (image: …)  GitHub가 만든다</text><g class=""><rect x="18" y="214" width="150" height="62" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="93.0" y="240.5" text-anchor="middle" class="t b">GitHub 커밋</text><text x="93.0" y="259.5" text-anchor="middle" class="s">PR·CI를 거친 코드</text></g><g class=""><rect x="186" y="214" width="140" height="62" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="256.0" y="240.5" text-anchor="middle" class="t b">Actions 러너</text><text x="256.0" y="259.5" text-anchor="middle" class="s">docker build + push</text></g><g class=""><rect x="346" y="214" width="205" height="62" rx="9" fill="#dff3f0" stroke="#1f9e8f" stroke-width="2"/><text x="448.5" y="240.5" text-anchor="middle" class="t b">friend-agent 저장소</text><text x="448.5" y="259.5" text-anchor="middle" class="s">커밋 SHA 태그</text></g><g class=""><rect x="572" y="214" width="170" height="62" rx="9" fill="#f4f1ec" stroke="#8a8177" stroke-width="2"/><text x="657.0" y="240.5" text-anchor="middle" class="t b">Cloud Run</text><text x="657.0" y="259.5" text-anchor="middle" class="s">image: 로 받음</text></g><line x1="170" y1="245" x2="183" y2="245" stroke="#1f9e8f" stroke-width="2.4" class="march" marker-end="url(#ahT)"/><line x1="328" y1="245" x2="343" y2="245" stroke="#1f9e8f" stroke-width="2.4" class="march" marker-end="url(#ahT)"/><line x1="553" y1="245" x2="569" y2="245" stroke="#1f9e8f" stroke-width="2.4" class="march" marker-end="url(#ahT)"/><text x="380" y="312" text-anchor="middle" class="s b">GitHub에서 만들면: 검토·테스트를 거친 커밋으로만 만들어지고, 누가 언제 만들었는지 기록이 남는다</text>
