<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="crayon-rough" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.12" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="crayon-rough-thin" x="-30%" y="-200%" width="160%" height="500%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06 0.4" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
