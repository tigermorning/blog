<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="「에이전트 시대의 AI 시스템 설계」(Generative AI Design Patterns) 3장을 사서 비유로 다시 풀어쓴 개인 독서 노트. 저작권 보호를 위해 비밀번호로 가려두었습니다.">
  <meta property="og:type" content="article">
  <meta property="og:title" content="다 외우지 말고, RAG로 찾아보게 하자 — 3장 정리노트 (비공개)">
  <meta property="og:url" content="https://tigermorning.github.io/blog/ko/generative-ai-design-patterns-ch3.html">
  <meta property="og:locale" content="ko_KR">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
<title>다 외우지 말고, RAG로 찾아보게 하자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* ---------- tokens ---------- */
  :root{
    --paper: #f2f5f7;
    --surface: #ffffff;
    --surface-2: #e8edf1;
    --ink: #1b2330;
    --ink-soft: #57626f;
    --ink-faint: #88929c;
    --line: #d7dee4;
    --accent: #a86a1c;        /* 토큰=동전 색, 금빛 앰버 */
    --accent-strong: #8a5612;
    --accent-teal: #1f7a6c;   /* 코드/구조/기술 요소 */
    --accent-teal-soft: #e4f1ee;
    --accent-soft: #f4e7d3;
    --shadow: 0 1px 2px rgba(27,35,48,.04), 0 8px 24px rgba(27,35,48,.06);
    --font-display: "Gowun Batang", "Noto Serif KR", serif;
    --font-body: "IBM Plex Sans KR", "Noto Sans KR", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "Noto Sans Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #10151c;
      --surface: #171d26;
      --surface-2: #1f2731;
      --ink: #e7ebf0;
      --ink-soft: #a4afbb;
      --ink-faint: #6d7885;
      --line: #2a3340;
      --accent: #dda252;
      --accent-strong: #f0b871;
      --accent-teal: #4bb3a0;
      --accent-teal-soft: #16302c;
      --accent-soft: #2d2314;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper: #10151c;
    --surface: #171d26;
    --surface-2: #1f2731;
    --ink: #e7ebf0;
    --ink-soft: #a4afbb;
    --ink-faint: #6d7885;
    --line: #2a3340;
    --accent: #dda252;
    --accent-strong: #f0b871;
    --accent-teal: #4bb3a0;
    --accent-teal-soft: #16302c;
    --accent-soft: #2d2314;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.75;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-strong);}
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--accent-teal);
    outline-offset:3px;
    border-radius:4px;
  }
  ::selection{background:var(--accent-soft); color:var(--ink);}

  .page{
    max-width:1120px; margin:0 auto; padding:0 20px 96px;
    display:grid; grid-template-columns:226px minmax(0,760px); gap:56px;
    align-items:start;
  }
  .wrap{min-width:0;}

  /* ---------- side nav ---------- */
  .side-nav{
    position:sticky; top:28px; align-self:start;
    max-height:calc(100vh - 56px); overflow-y:auto;
    padding:32px 10px 32px 0;
    font-size:13.5px;
  }
  .side-nav-title{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-faint);
    margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--line);
  }
  .side-nav ol{list-style:none; margin:0; padding:0;}
  .side-nav > ol > li{margin-bottom:2px;}
  .side-nav a{
    display:flex; align-items:center; gap:9px;
    text-decoration:none; color:var(--ink-soft);
    padding:7px 9px; border-radius:7px; line-height:1.4;
    transition:background .15s, color .15s;
  }
  .side-nav a:hover{background:var(--surface-2); color:var(--ink);}
  .side-nav a.active{color:var(--accent-strong); background:var(--accent-soft); font-weight:600;}
  .side-nav .n{font-family:var(--font-mono); font-size:11px; color:var(--accent); flex:none; width:24px;}
  .side-nav ol.sub{margin:2px 0 8px 24px; padding-left:11px; border-left:1px solid var(--line);}
  .side-nav ol.sub a{font-size:12.5px; padding:5px 9px; color:var(--ink-faint);}
  .side-nav ol.sub a:hover{color:var(--ink-soft);}
  .side-nav ol.sub a.active{color:var(--accent-strong); background:transparent; font-weight:500;}
  @media (max-width:960px){
    .page{grid-template-columns:1fr; gap:0;}
    .side-nav{display:none;}
  }

  /* ---------- hero ---------- */
  .hero{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
    margin-bottom:40px;
  }
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-teal);
    margin-bottom:18px;
  }
  .kicker::before{
    content:"";
    width:16px; height:1px;
    background:var(--accent-teal);
  }
  h1.title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(34px, 6vw, 50px);
    line-height:1.22;
    margin:0 0 18px;
    text-wrap:balance;
    color:var(--ink);
  }
  .lede{
    font-size:17.5px;
    color:var(--ink-soft);
    max-width:60ch;
    margin:0 0 22px;
  }
  .meta{
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--ink-faint);
  }

  /* ---------- toc (mobile fallback) ---------- */
  .toc{
    display:none; flex-wrap:wrap; gap:8px;
    margin:28px 0 0;
    padding:0; list-style:none;
  }
  @media (max-width:960px){
    .toc{display:flex;}
  }
  .toc a{
    display:block;
    text-decoration:none;
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    transition:border-color .15s, color .15s;
  }
  .toc a:hover{border-color:var(--accent-teal); color:var(--accent-teal);}
  .toc b{font-family:var(--font-mono); color:var(--accent); font-weight:500; margin-right:5px;}

  /* ---------- section shell ---------- */
  section.sec{margin:0 0 64px; scroll-margin-top:24px;}
  .sec-head{
    display:flex; align-items:baseline; gap:14px;
    margin-bottom:20px;
  }
  .sec-num{
    font-family:var(--font-mono);
    font-size:13px; font-weight:500;
    color:var(--surface);
    background:var(--ink);
    border-radius:6px;
    padding:4px 9px;
    flex:none;
  }
  h2.h2{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  h3.h3{
    font-family:var(--font-body);
    font-weight:600;
    font-size:16.5px;
    color:var(--accent-teal);
    margin:34px 0 10px;
    display:flex; align-items:center; gap:8px;
    scroll-margin-top:24px;
  }
  h3.h3 .tag{
    font-family:var(--font-mono);
    font-size:11px; color:var(--ink-faint);
    border:1px solid var(--line);
    border-radius:5px; padding:1px 6px;
    font-weight:400;
  }
  h4.h4{
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    margin:24px 0 8px;
  }
  p{margin:0 0 15px; color:var(--ink);}
  .sub p{color:var(--ink-soft);}
  strong{color:var(--ink); font-weight:600;}
  ul.plain, ol.plain{margin:0 0 15px; padding-left:22px; color:var(--ink);}
  ul.plain li, ol.plain li{margin-bottom:6px;}

  /* ---------- etymology / term callout ---------- */
  .etym{
    display:flex; gap:14px;
    background:var(--accent-teal-soft);
    border-left:3px solid var(--accent-teal);
    border-radius:0 10px 10px 0;
    padding:16px 18px;
    margin:18px 0 22px;
  }
  .etym .label{
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:.06em;
    color:var(--accent-teal);
    text-transform:uppercase;
    flex:none; padding-top:3px;
  }
  .etym .body{font-size:14.5px; color:var(--ink-soft);}
  .etym .term{
    font-family:var(--font-display);
    font-style:italic; font-weight:700;
    color:var(--ink); font-size:16px;
  }

  /* ---------- generic card ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    box-shadow:var(--shadow);
    margin:18px 0 22px;
  }
  .analogy{
    background:var(--surface-2);
    border-radius:12px;
    padding:16px 18px;
    margin:14px 0 20px;
    font-size:14.5px;
    color:var(--ink-soft);
  }
  .analogy b{color:var(--accent-strong); font-weight:600;}
  .analogy table{background:var(--surface);}

  /* ---------- code block + plain-language pairing ---------- */
  pre.code{
    background:#161b22; color:#d7dee4;
    border-radius:10px; padding:16px 18px;
    overflow-x:auto; margin:10px 0 8px;
    font-family:var(--font-mono); font-size:12.5px; line-height:1.65;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) pre.code{ background:#0b0e13; }
  }
  :root[data-theme="dark"] pre.code{ background:#0b0e13; }
  pre.code .cm{color:#7f8ea3;}
  .plain-lang{
    display:flex; gap:12px;
    background:var(--accent-soft);
    border-radius:0 0 10px 10px;
    padding:12px 16px;
    margin:0 0 22px;
    font-size:13.5px; color:var(--ink-soft);
  }
  .plain-lang .pl-label{
    flex:none; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--accent-strong); font-weight:700; padding-top:2px;
  }
  .plain-lang strong{color:var(--accent-strong);}

  /* ---------- flow diagram (simple horizontal) ---------- */
  .flow{
    display:flex; align-items:stretch; gap:6px; flex-wrap:wrap;
    margin:20px 0 24px;
  }
  .flow-box{
    flex:1 1 120px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 12px;
    text-align:center;
    font-size:13.5px;
    color:var(--ink);
    display:flex; flex-direction:column; justify-content:center; gap:3px;
  }
  .flow-box .label{font-weight:600;}
  .flow-box .sub{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}
  .flow-box.accent{border-color:var(--accent); background:var(--accent-soft);}
  .flow-arrow{
    flex:none; display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:18px; width:20px;
  }
  @media (max-width:520px){
    .flow{flex-direction:column;}
    .flow-arrow{transform:rotate(90deg); width:auto; padding:2px 0;}
  }

  /* ---------- compare grid ---------- */
  .compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:20px 0 8px;}
  .compare .card{margin:0;}
  .compare .card h4{
    margin:0 0 4px; font-family:var(--font-mono); font-size:13px;
    color:var(--accent-teal); text-transform:uppercase; letter-spacing:.04em;
  }
  .compare .card p{font-size:14.5px;}
  .compare .snippet{
    background:var(--surface-2); border-radius:8px; padding:10px 12px;
    font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
    line-height:1.6; margin-top:10px; white-space:pre-wrap;
  }
  @media (max-width:560px){.compare{grid-template-columns:1fr;}}
  .compare .card.choice-bad{border-left:3px solid #b23b3b;}
  .compare .card.choice-good{border-left:3px solid var(--accent-teal);}
  .compare .card h4.choice-bad-label{color:#b23b3b;}
  .compare .card h4.choice-good-label{color:var(--accent-teal);}

  /* ---------- journey / stepper ---------- */
  .journey{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px 20px;
    margin:22px 0 26px;
    box-shadow:var(--shadow);
  }
  .journey-title{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:16px;
  }
  .jstep{display:grid; grid-template-columns:26px 1fr; column-gap:14px; position:relative;}
  .jstep .dot{
    width:26px; height:26px; border-radius:50%;
    background:var(--accent-teal-soft); border:2px solid var(--accent-teal);
    color:var(--accent-teal); font-family:var(--font-mono); font-size:10.5px;
    display:flex; align-items:center; justify-content:center; font-weight:600;
    position:relative; z-index:1;
  }
  .jstep:not(:last-child) .dot::after{
    content:""; position:absolute; left:50%; top:26px;
    width:2px; height:calc(100% + 14px);
    background:var(--line); transform:translateX(-50%);
  }
  .jstep .jbody{padding-bottom:22px;}
  .jstep:last-child .jbody{padding-bottom:0;}
  .jstep h5{margin:0 0 4px; font-size:14.5px; font-weight:600; color:var(--ink);}
  .jstep p{margin:0; font-size:13px; color:var(--ink-soft);}
  .jstep .why{
    display:inline-block; margin-top:7px;
    font-size:12px; color:var(--accent-strong);
    background:var(--accent-soft); border-radius:6px; padding:4px 9px;
  }

  /* ---------- gen-compare (before/after model output) ---------- */
  .gen-compare{display:flex; flex-direction:column; gap:10px; margin:18px 0 8px;}
  .gen-row{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .gen-row.bad{border-left:3px solid #b23b3b;}
  .gen-row.good{border-left:3px solid var(--accent-teal);}
  .gen-row .t-label{
    font-family:var(--font-mono); font-size:11.5px; color:var(--accent-strong);
    margin-bottom:7px; display:block; font-weight:600;
  }
  .gen-row p{margin:0; font-size:14px; color:var(--ink); line-height:1.7;}

  /* ---------- data-to-method table ---------- */
  .ptable{
    width:100%; border-collapse:collapse; margin:18px 0 22px;
    font-size:13.5px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .ptable th, .ptable td{ text-align:left; padding:12px 16px; border-bottom:1px solid var(--line); }
  .ptable th{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2); font-weight:500; }
  .ptable tr:last-child td{ border-bottom:none; }
  .ptable td strong{ color:var(--accent-strong); }
  .ptable-wrap{ overflow-x:auto; }

  table{ width:100%; border-collapse:collapse; margin:14px 0 20px; font-size:13.5px; }
  table th, table td{ text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  table th{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); font-weight:500; }
  code{ font-family:var(--font-mono); font-size:0.92em; background:var(--surface-2); padding:1px 6px; border-radius:5px; color:var(--accent-strong); }

  /* ---------- misc ---------- */
  .divider-note{
    display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:var(--ink-faint); margin:26px 0;
  }
  .divider-note::before, .divider-note::after{content:""; flex:1; height:1px; background:var(--line);}

  .figref{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
    text-align:center; margin:-14px 0 22px;
  }

  footer{
    border-top:1px solid var(--line);
    padding-top:28px; margin-top:16px;
    font-size:13px; color:var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
  /* ---------- code block: caption + copy button ---------- */
  .code-wrap{ position:relative; margin:10px 0 8px; }
  .code-wrap pre.code{ margin:0; padding-right:76px; }
  .code-wrap .code-cap + pre.code{ border-radius:0 0 10px 10px; }
  .code-cap{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
    color:var(--ink-faint); background:var(--surface-2);
    border:1px solid var(--line); border-bottom:none;
    border-radius:10px 10px 0 0; padding:7px 14px;
  }
  .code-cap b{ color:var(--accent-strong); font-weight:600; }
  .copy-btn{
    position:absolute; top:8px; right:8px; z-index:2;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em;
    color:#a4afbb; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16); border-radius:6px;
    padding:4px 9px; cursor:pointer; line-height:1.4;
    transition:background .15s, color .15s, border-color .15s;
  }
  .code-wrap .code-cap ~ .copy-btn{ top:39px; }
  .copy-btn:hover{ background:rgba(255,255,255,.15); color:#e7ebf0; }
  .copy-btn.done{ color:#4bb3a0; border-color:#4bb3a0; background:rgba(75,179,160,.12); }

  /* ---------- warning card ---------- */
  .card.warn{ border-left:3px solid #b23b3b; }
  .card.warn .wl{
    display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em;
    text-transform:uppercase; color:#b23b3b; font-weight:700; margin-bottom:8px;
  }

  /* ---------- 요약 노트 7규칙: 정의 / 읽기 전 안내 (2026.09.09 ch3에서 추가) ---------- */
  .one-liner{
    border-left:4px solid var(--accent);
    background:var(--accent-soft);
    border-radius:0 12px 12px 0;
    padding:16px 20px;
    margin:0 0 26px;
    font-family:var(--font-display);
    font-size:18px;
    font-weight:700;
    color:var(--ink);
  }
  .why-read{
    background:var(--surface);
    border:1.5px dashed var(--line);
    border-radius:4px 18px 4px 18px;
    padding:20px 22px 16px;
    margin:0 0 30px;
    box-shadow:var(--shadow);
  }
  .why-read-title{
    margin:0 0 14px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15.5px;
    color:var(--accent-teal);
  }
  .why-read dl{margin:0;}
  .why-read dt{
    display:inline-block;
    margin-bottom:5px;
    padding:2px 11px;
    border-radius:999px;
    background:var(--accent-teal);
    color:#fff;
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:600;
  }
  .why-read dd{margin:0 0 14px; font-size:14px; line-height:1.75; color:var(--ink-soft);}
  .why-read dd:last-of-type{margin-bottom:2px;}

  /* ---------- 전문 용어 각주 ---------- */
  .fn-ref{font-size:0.72em; vertical-align:super; line-height:0;}
  .fn-ref a{color:var(--accent-teal); text-decoration:none; font-weight:700;}
  .footnotes{
    margin:44px 0 0;
    padding-top:18px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .footnotes ol{padding-left:20px; margin:0;}
  .footnotes li{margin-bottom:7px;}
  .footnotes li:target{color:var(--ink); background:var(--accent-soft); border-radius:4px;}
  .footnotes a{color:var(--accent-teal);}

  /* ---------- 코드 실습 위치 뱃지 ---------- */
  .run-tag{
    display:block;
    margin:18px 0 0;
    padding:7px 16px;
    background:var(--ink);
    color:var(--surface);
    font-family:var(--font-body);
    font-size:12px;
    font-weight:700;
    border-radius:8px 8px 0 0;
    border-top:3px solid var(--accent);
  }
  .run-tag + .code-wrap{margin-top:0;}

  <script>
  (function(){
    var KEY = "unlocked-book-agent-era-ai-system-design"; // 이 책 전체가 공유하는 키 — 장마다 다시 안 물어봄
    var ITER = 250000;
    var payload = JSON.parse(document.getElementById("lockedPayload").textContent);
    var opened = false;

    function bytes(b64){
      var bin = atob(b64), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function decrypt(pass){
      var enc = new TextEncoder();
      return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
        .then(function(base){
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: bytes(payload.salt), iterations: ITER, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        })
        .then(function(key){
          return crypto.subtle.decrypt(
            { name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.data));
        })
        .then(function(buf){ return new TextDecoder().decode(buf); });
    }

    // innerHTML로 넣은 <script>는 실행되지 않으므로 다시 만들어 붙인다.
    function runScripts(root){
      var list = Array.prototype.slice.call(root.querySelectorAll("script"));
      list.forEach(function(old){
        var s = document.createElement("script");
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    }

    function reveal(html){
      if (opened) return;
      opened = true;
      var holder = document.createElement("div");
      holder.innerHTML = html;
      var page = holder.querySelector("#pageContent");
      if (page) page.style.display = "";
      while (holder.firstChild) document.body.appendChild(holder.firstChild);
      runScripts(document.body);
      var gate = document.getElementById("lockGate");
      if (gate) gate.parentNode.removeChild(gate);
    }

    function tryPass(pass, onFail){
      decrypt(pass).then(function(html){
        try { sessionStorage.setItem(KEY, pass); } catch(e){}
        reveal(html);
      }).catch(function(){ if (onFail) onFail(); });
    }

    document.addEventListener("DOMContentLoaded", function(){
      var saved = null;
      try { saved = sessionStorage.getItem(KEY); } catch(e){}
      if (saved) tryPass(saved);

      function submit(){
        var v = document.getElementById("lockInput").value;
        tryPass(v, function(){
          document.getElementById("lockError").style.display = "block";
        });
      }
      document.getElementById("lockBtn").addEventListener("click", submit);
      document.getElementById("lockInput").addEventListener("keydown", function(ev){
        if (ev.key === "Enter") submit();
      });
    });
  })();
  </script>
