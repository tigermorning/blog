<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="「에이전트 시대의 AI 시스템 설계」(Generative AI Design Patterns) 1장을 신입사원 비유 하나로 다시 풀어쓴 개인 독서 노트. 저작권 보호를 위해 비밀번호로 가려두었습니다.">
  <meta property="og:type" content="article">
  <meta property="og:title" content="프롬프트에서 에이전트까지 — 1장 정리노트 (비공개)">
  <meta property="og:url" content="https://tigermorning.github.io/blog/ko/generative-ai-design-patterns-ch1.html">
  <meta property="og:locale" content="ko_KR">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
<title>프롬프트에서 에이전트까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* ---------- tokens ---------- */
  :root{
    --paper: #f2f5f7;
    --surface: #ffffff;
    --surface-2: #e8edf1;
    --ink: #1b2330;
    --ink-soft: #57626f;
    --ink-faint: #88929c;
    --line: #d7dee4;
    --accent: #a86a1c;        /* 토큰=동전 색, 금빛 앰버 */
    --accent-strong: #8a5612;
    --accent-teal: #1f7a6c;   /* 코드/구조/기술 요소 */
    --accent-teal-soft: #e4f1ee;
    --accent-soft: #f4e7d3;
    --shadow: 0 1px 2px rgba(27,35,48,.04), 0 8px 24px rgba(27,35,48,.06);
    --font-display: "Gowun Batang", "Noto Serif KR", serif;
    --font-body: "IBM Plex Sans KR", "Noto Sans KR", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "Noto Sans Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #10151c;
      --surface: #171d26;
      --surface-2: #1f2731;
      --ink: #e7ebf0;
      --ink-soft: #a4afbb;
      --ink-faint: #6d7885;
      --line: #2a3340;
      --accent: #dda252;
      --accent-strong: #f0b871;
      --accent-teal: #4bb3a0;
      --accent-teal-soft: #16302c;
      --accent-soft: #2d2314;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper: #10151c;
    --surface: #171d26;
    --surface-2: #1f2731;
    --ink: #e7ebf0;
    --ink-soft: #a4afbb;
    --ink-faint: #6d7885;
    --line: #2a3340;
    --accent: #dda252;
    --accent-strong: #f0b871;
    --accent-teal: #4bb3a0;
    --accent-teal-soft: #16302c;
    --accent-soft: #2d2314;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.75;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-strong);}
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--accent-teal);
    outline-offset:3px;
    border-radius:4px;
  }
  ::selection{background:var(--accent-soft); color:var(--ink);}

  .page{
    max-width:1120px; margin:0 auto; padding:0 20px 96px;
    display:grid; grid-template-columns:226px minmax(0,760px); gap:56px;
    align-items:start;
  }
  .wrap{min-width:0;}

  /* ---------- side nav ---------- */
  .side-nav{
    position:sticky; top:28px; align-self:start;
    max-height:calc(100vh - 56px); overflow-y:auto;
    padding:32px 10px 32px 0;
    font-size:13.5px;
  }
  .side-nav-title{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-faint);
    margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--line);
  }
  .side-nav ol{list-style:none; margin:0; padding:0;}
  .side-nav > ol > li{margin-bottom:2px;}
  .side-nav a{
    display:flex; align-items:center; gap:9px;
    text-decoration:none; color:var(--ink-soft);
    padding:7px 9px; border-radius:7px; line-height:1.4;
    transition:background .15s, color .15s;
  }
  .side-nav a:hover{background:var(--surface-2); color:var(--ink);}
  .side-nav a.active{color:var(--accent-strong); background:var(--accent-soft); font-weight:600;}
  .side-nav .n{font-family:var(--font-mono); font-size:11px; color:var(--accent); flex:none; width:24px;}
  .side-nav ol.sub{margin:2px 0 8px 24px; padding-left:11px; border-left:1px solid var(--line);}
  .side-nav ol.sub a{font-size:12.5px; padding:5px 9px; color:var(--ink-faint);}
  .side-nav ol.sub a:hover{color:var(--ink-soft);}
  .side-nav ol.sub a.active{color:var(--accent-strong); background:transparent; font-weight:500;}
  @media (max-width:960px){
    .page{grid-template-columns:1fr; gap:0;}
    .side-nav{display:none;}
  }

  /* ---------- hero ---------- */
  .hero{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
    margin-bottom:40px;
  }
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-teal);
    margin-bottom:18px;
  }
  .kicker::before{
    content:"";
    width:16px; height:1px;
    background:var(--accent-teal);
  }
  h1.title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(34px, 6vw, 50px);
    line-height:1.22;
    margin:0 0 18px;
    text-wrap:balance;
    color:var(--ink);
  }
  .lede{
    font-size:17.5px;
    color:var(--ink-soft);
    max-width:60ch;
    margin:0 0 22px;
  }
  .meta{
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--ink-faint);
  }

  /* ---------- toc (mobile fallback) ---------- */
  .toc{
    display:none; flex-wrap:wrap; gap:8px;
    margin:28px 0 0;
    padding:0; list-style:none;
  }
  @media (max-width:960px){
    .toc{display:flex;}
  }
  .toc a{
    display:block;
    text-decoration:none;
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    transition:border-color .15s, color .15s;
  }
  .toc a:hover{border-color:var(--accent-teal); color:var(--accent-teal);}
  .toc b{font-family:var(--font-mono); color:var(--accent); font-weight:500; margin-right:5px;}

  /* ---------- section shell ---------- */
  section.sec{margin:0 0 64px; scroll-margin-top:24px;}
  .sec-head{
    display:flex; align-items:baseline; gap:14px;
    margin-bottom:20px;
  }
  .sec-num{
    font-family:var(--font-mono);
    font-size:13px; font-weight:500;
    color:var(--surface);
    background:var(--ink);
    border-radius:6px;
    padding:4px 9px;
    flex:none;
  }
  h2.h2{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  h3.h3{
    font-family:var(--font-body);
    font-weight:600;
    font-size:16.5px;
    color:var(--accent-teal);
    margin:34px 0 10px;
    display:flex; align-items:center; gap:8px;
    scroll-margin-top:24px;
  }
  h3.h3 .tag{
    font-family:var(--font-mono);
    font-size:11px; color:var(--ink-faint);
    border:1px solid var(--line);
    border-radius:5px; padding:1px 6px;
    font-weight:400;
  }
  p{margin:0 0 15px; color:var(--ink);}
  .sub p{color:var(--ink-soft);}
  strong{color:var(--ink); font-weight:600;}

  /* ---------- etymology callout ---------- */
  .etym{
    display:flex; gap:14px;
    background:var(--accent-teal-soft);
    border-left:3px solid var(--accent-teal);
    border-radius:0 10px 10px 0;
    padding:16px 18px;
    margin:18px 0 22px;
  }
  .etym .label{
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:.06em;
    color:var(--accent-teal);
    text-transform:uppercase;
    flex:none; padding-top:3px;
    writing-mode:horizontal-tb;
  }
  .etym .body{font-size:14.5px; color:var(--ink-soft);}
  .etym .term{
    font-family:var(--font-display);
    font-style:italic; font-weight:700;
    color:var(--ink); font-size:16px;
  }

  /* ---------- generic card ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    box-shadow:var(--shadow);
  }
  .analogy{
    background:var(--surface-2);
    border-radius:12px;
    padding:16px 18px;
    margin:14px 0 20px;
    font-size:14.5px;
    color:var(--ink-soft);
  }
  .analogy b{color:var(--accent-strong); font-weight:600;}

  /* ---------- flow diagram ---------- */
  .flow{
    display:flex; align-items:stretch; gap:6px; flex-wrap:wrap;
    margin:20px 0 24px;
  }
  .flow-box{
    flex:1 1 120px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 12px;
    text-align:center;
    font-size:13.5px;
    color:var(--ink);
    display:flex; flex-direction:column; justify-content:center; gap:3px;
  }
  .flow-box .label{font-weight:600;}
  .flow-box .sub{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}
  .flow-box.accent{border-color:var(--accent); background:var(--accent-soft);}
  .flow-arrow{
    flex:none; display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:18px; width:20px;
  }
  @media (max-width:520px){
    .flow{flex-direction:column;}
    .flow-arrow{transform:rotate(90deg); width:auto; padding:2px 0;}
  }

  /* ---------- coin row ---------- */
  .coinrow{display:flex; gap:6px; align-items:center; margin:14px 0 6px; flex-wrap:wrap;}
  .coin{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-strong), var(--accent));
    flex:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .coinrow .note{font-size:12.5px; color:var(--ink-faint); margin-left:6px;}

  /* ---------- dial demo ---------- */
  .dial-demo{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    margin:22px 0 20px;
    box-shadow:var(--shadow);
  }
  .dial-demo .caption{font-size:13px; color:var(--ink-faint); margin-bottom:10px;}
  .stem-box{
    background:var(--surface-2); border-radius:10px;
    padding:12px 16px; margin-bottom:18px;
    font-size:14px; color:var(--ink);
  }
  .stem-box .stem-en{font-family:var(--font-mono); font-size:15px;}
  .stem-box .stem-en .blank{color:var(--accent-strong); font-weight:700;}
  .stem-box .stem-ko{font-size:12.5px; color:var(--ink-faint); margin-top:4px;}
  .dial-slider-row{display:flex; align-items:center; gap:14px; margin-bottom:8px;}
  .dial-slider-row .dl{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); flex:none; display:flex; flex-direction:column; line-height:1.35;}
  .dial-slider-row .dl:last-child{text-align:right;}
  .dial-slider-row .dl small{font-family:var(--font-body); font-size:10.5px; color:var(--ink-faint); font-weight:400;}
  .t-readout{
    text-align:center; font-family:var(--font-mono); font-size:12px;
    color:var(--accent-strong); margin-bottom:18px;
  }
  input[type=range]{
    flex:1;
    -webkit-appearance:none; appearance:none;
    height:6px; border-radius:999px;
    background:var(--surface-2);
    outline-offset:6px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:18px; height:18px; border-radius:50%;
    background:var(--accent);
    border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--accent-strong);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%;
    background:var(--accent); border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--accent-strong); cursor:pointer;
  }
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-row .w{width:38px; flex:none; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);}
  .bar-track{flex:1; height:16px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--accent-strong), var(--accent)); border-radius:5px; transition:width .25s ease;}
  .bar-row .pct{width:52px; flex:none; text-align:right; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .mode-readout{
    margin-top:14px; font-size:13.5px; color:var(--accent-strong); font-weight:600;
    font-family:var(--font-body);
  }

  /* static top-k / top-p mini bars */
  .mini-compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:20px 0 22px;}
  .mini-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .mini-card h4{margin:0 0 4px; font-size:14px; font-family:var(--font-mono); color:var(--ink);}
  .mini-card .d{font-size:12.5px; color:var(--ink-faint); margin-bottom:12px;}
  .mini-bars{display:flex; align-items:flex-end; gap:6px; height:70px;}
  .mini-bars i{flex:1; border-radius:3px 3px 0 0; background:var(--accent); display:block;}
  .mini-bars i.off{background:var(--surface-2);}
  @media (max-width:560px){.mini-compare{grid-template-columns:1fr;}}

  /* ---------- agent loop svg ---------- */
  .loop-wrap{display:flex; justify-content:center; margin:22px 0 8px;}
  .loop-wrap svg{max-width:100%; height:auto;}
  .loop-node-label{font-family:var(--font-body); font-weight:600; font-size:13px; fill:var(--ink);}
  .loop-node-sub{font-family:var(--font-body); font-size:10.5px; fill:var(--ink-faint);}

  /* ---------- compare grid (zero/few shot) ---------- */
  .compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:20px 0 8px;}
  .compare .card h4{
    margin:0 0 4px; font-family:var(--font-mono); font-size:13px;
    color:var(--accent-teal); text-transform:uppercase; letter-spacing:.04em;
  }
  .compare .card p{font-size:14.5px;}
  .compare .snippet{
    background:var(--surface-2); border-radius:8px; padding:10px 12px;
    font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
    line-height:1.6; margin-top:10px; white-space:pre-wrap;
  }
  @media (max-width:560px){.compare{grid-template-columns:1fr;}}

  /* ---------- journey overview (1.2 relationship map) ---------- */
  .journey{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px 20px;
    margin:22px 0 26px;
    box-shadow:var(--shadow);
  }
  .journey-title{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:16px;
  }
  .jstep{display:grid; grid-template-columns:26px 1fr; column-gap:14px; position:relative;}
  .jstep .dot{
    width:26px; height:26px; border-radius:50%;
    background:var(--accent-teal-soft); border:2px solid var(--accent-teal);
    color:var(--accent-teal); font-family:var(--font-mono); font-size:10.5px;
    display:flex; align-items:center; justify-content:center; font-weight:600;
    position:relative; z-index:1;
  }
  .jstep:not(:last-child) .dot::after{
    content:""; position:absolute; left:50%; top:26px;
    width:2px; height:calc(100% + 14px);
    background:var(--line); transform:translateX(-50%);
  }
  .jstep .jbody{padding-bottom:22px;}
  .jstep:last-child .jbody{padding-bottom:0;}
  .jstep h5{margin:0 0 4px; font-size:14.5px; font-weight:600; color:var(--ink);}
  .jstep p{margin:0; font-size:13px; color:var(--ink-soft);}
  .jstep .why{
    display:inline-block; margin-top:7px;
    font-size:12px; color:var(--accent-strong);
    background:var(--accent-soft); border-radius:6px; padding:4px 9px;
  }

  /* ---------- pipeline stage boxes ---------- */
  .stage-list{display:flex; flex-direction:column; gap:0; margin:20px 0 22px;}
  .stage{
    display:flex; gap:16px; padding:16px 0;
    border-top:1px solid var(--line);
  }
  .stage:first-child{border-top:none;}
  .stage .n{
    flex:none; width:30px; height:30px; border-radius:50%;
    background:var(--surface-2); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:13px; font-weight:500;
  }
  .stage .n.on{background:var(--accent); color:var(--surface);}
  .stage h5{margin:0 0 4px; font-size:14.5px; font-weight:600;}
  .stage p{margin:0; font-size:13.5px; color:var(--ink-soft);}

  /* ---------- generated-output comparison ---------- */
  .gen-compare{display:flex; flex-direction:column; gap:10px; margin:18px 0 8px;}
  .gen-row{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .gen-row .t-label{
    font-family:var(--font-mono); font-size:11.5px; color:var(--accent-strong);
    margin-bottom:7px; display:block; font-weight:600;
  }
  .gen-row p{margin:0; font-size:14px; color:var(--ink); line-height:1.7;}

  /* ---------- roadmap grid ---------- */
  .roadmap{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin:22px 0 6px;}
  .rmap-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:15px 17px;
  }
  .rmap-card .num{
    font-family:var(--font-mono); font-size:12px; color:var(--accent);
    display:block; margin-bottom:5px;
  }
  .rmap-card h5{margin:0 0 5px; font-size:14.5px; font-weight:600;}
  .rmap-card p{margin:0; font-size:13px; color:var(--ink-soft);}
  @media (max-width:560px){.roadmap{grid-template-columns:1fr;}}

  /* ---------- data-to-method table ---------- */
  .ptable{
    width:100%; border-collapse:collapse; margin:18px 0 22px;
    font-size:13.5px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .ptable th, .ptable td{ text-align:left; padding:12px 16px; border-bottom:1px solid var(--line); }
  .ptable th{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2); font-weight:500; }
  .ptable tr:last-child td{ border-bottom:none; }
  .ptable td strong{ color:var(--accent-strong); }
  .ptable-wrap{ overflow-x:auto; }

  /* ---------- qa review ---------- */
  .qa-fam{
    margin:28px 0 12px; font-family:var(--font-mono); font-size:11.5px; font-weight:600;
    letter-spacing:.05em; color:var(--accent-strong); padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .qa-fam:first-of-type{ margin-top:6px; }
  .qa-item{
    border:1px solid var(--line); border-radius:12px; background:var(--surface);
    padding:18px 20px; margin:0 0 14px; box-shadow:var(--shadow);
  }
  .qa-tag{
    display:inline-block; font-family:var(--font-mono); font-size:11px; font-weight:700;
    color:var(--accent-strong); background:var(--accent-soft); padding:2px 9px; border-radius:5px; margin-bottom:9px;
  }
  .qa-q{ margin:0 0 10px; font-size:15px; font-weight:600; color:var(--ink); }
  .qa-a{ margin:0; font-size:14px; color:var(--ink-soft); }
  .qa-a strong{ color:var(--accent-strong); }
  .qa-a + .qa-a{ margin-top:8px; }
  .qa-follow{
    margin-top:12px; padding:12px 14px; border-radius:8px;
    background:var(--accent-teal-soft); font-size:13.5px;
  }
  .qa-flabel{

  <script>
  (function(){
    var KEY = "unlocked-book-agent-era-ai-system-design"; // 이 책 전체가 공유하는 키 — 장마다 다시 안 물어봄
    var ITER = 250000;
    var payload = JSON.parse(document.getElementById("lockedPayload").textContent);
    var opened = false;

    function bytes(b64){
      var bin = atob(b64), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function decrypt(pass){
      var enc = new TextEncoder();
      return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
        .then(function(base){
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: bytes(payload.salt), iterations: ITER, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        })
        .then(function(key){
          return crypto.subtle.decrypt(
            { name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.data));
        })
        .then(function(buf){ return new TextDecoder().decode(buf); });
    }

    // innerHTML로 넣은 <script>는 실행되지 않으므로 다시 만들어 붙인다.
    function runScripts(root){
      var list = Array.prototype.slice.call(root.querySelectorAll("script"));
      list.forEach(function(old){
        var s = document.createElement("script");
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    }

    function reveal(html){
      if (opened) return;
      opened = true;
      var holder = document.createElement("div");
      holder.innerHTML = html;
      var page = holder.querySelector("#pageContent");
      if (page) page.style.display = "";
      while (holder.firstChild) document.body.appendChild(holder.firstChild);
      runScripts(document.body);
      var gate = document.getElementById("lockGate");
      if (gate) gate.parentNode.removeChild(gate);
    }

    function tryPass(pass, onFail){
      decrypt(pass).then(function(html){
        try { sessionStorage.setItem(KEY, pass); } catch(e){}
        reveal(html);
      }).catch(function(){ if (onFail) onFail(); });
    }

    document.addEventListener("DOMContentLoaded", function(){
      var saved = null;
      try { saved = sessionStorage.getItem(KEY); } catch(e){}
      if (saved) tryPass(saved);

      function submit(){
        var v = document.getElementById("lockInput").value;
        tryPass(v, function(){
          document.getElementById("lockError").style.display = "block";
        });
      }
      document.getElementById("lockBtn").addEventListener("click", submit);
      document.getElementById("lockInput").addEventListener("keydown", function(ev){
        if (ev.key === "Enter") submit();
      });
    });
  })();
  </script>
