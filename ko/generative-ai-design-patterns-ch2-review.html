<style>
  :root{
    --paper: #f2f5f7;
    --surface: #ffffff;
    --surface-2: #e8edf1;
    --ink: #1b2330;
    --ink-soft: #57626f;
    --ink-faint: #88929c;
    --line: #d7dee4;
    --accent: #a86a1c;
    --accent-strong: #8a5612;
    --accent-teal: #1f7a6c;
    --accent-teal-soft: #e4f1ee;
    --accent-soft: #f4e7d3;
    --shadow: 0 1px 2px rgba(27,35,48,.04), 0 8px 24px rgba(27,35,48,.06);
    --font-display: "Gowun Batang", "Noto Serif KR", serif;
    --font-body: "IBM Plex Sans KR", "Noto Sans KR", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "Noto Sans Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #10151c; --surface: #171d26; --surface-2: #1f2731;
      --ink: #e7ebf0; --ink-soft: #a4afbb; --ink-faint: #6d7885; --line: #2a3340;
      --accent: #dda252; --accent-strong: #f0b871;
      --accent-teal: #4bb3a0; --accent-teal-soft: #16302c; --accent-soft: #2d2314;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper: #10151c; --surface: #171d26; --surface-2: #1f2731;
    --ink: #e7ebf0; --ink-soft: #a4afbb; --ink-faint: #6d7885; --line: #2a3340;
    --accent: #dda252; --accent-strong: #f0b871;
    --accent-teal: #4bb3a0; --accent-teal-soft: #16302c; --accent-soft: #2d2314;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.75; font-size:16px; -webkit-font-smoothing:antialiased; }
  a{color:var(--accent-strong);}
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--accent-teal); outline-offset:3px; border-radius:4px; }
  ::selection{background:var(--accent-soft); color:var(--ink);}

  .page{ max-width:1120px; margin:0 auto; padding:0 20px 96px; display:grid; grid-template-columns:226px minmax(0,760px); gap:56px; align-items:start; }
  .wrap{min-width:0;}

  .side-nav{ position:sticky; top:28px; align-self:start; max-height:calc(100vh - 56px); overflow-y:auto; padding:32px 10px 32px 0; font-size:13.5px; }
  .side-nav-title{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .side-nav ol{list-style:none; margin:0; padding:0;}
  .side-nav > ol > li{margin-bottom:2px;}
  .side-nav a{ display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink-soft); padding:7px 9px; border-radius:7px; line-height:1.4; transition:background .15s, color .15s; }
  .side-nav a:hover{background:var(--surface-2); color:var(--ink);}
  .side-nav a.active{color:var(--accent-strong); background:var(--accent-soft); font-weight:600;}
  .side-nav .n{font-family:var(--font-mono); font-size:11px; color:var(--accent); flex:none; width:24px;}
  @media (max-width:960px){ .page{grid-template-columns:1fr; gap:0;} .side-nav{display:none;} }

  .hero{ padding:64px 0 40px; border-bottom:1px solid var(--line); margin-bottom:40px; }
  .kicker{ display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-teal); margin-bottom:18px; }
  .kicker::before{ content:""; width:16px; height:1px; background:var(--accent-teal); }
  h1.title{ font-family:var(--font-display); font-weight:700; font-size:clamp(34px, 6vw, 50px); line-height:1.22; margin:0 0 18px; text-wrap:balance; color:var(--ink); }
  .lede{ font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:0 0 22px; }
  .meta{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); }

  section.sec{margin:0 0 64px; scroll-margin-top:24px;}
  p{margin:0 0 15px; color:var(--ink);}
  strong{color:var(--ink); font-weight:600;}

  .ptable{ width:100%; border-collapse:collapse; margin:18px 0 22px; font-size:13.5px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
  .ptable th, .ptable td{ text-align:left; padding:12px 16px; border-bottom:1px solid var(--line); }
  .ptable th{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2); font-weight:500; }
  .ptable tr:last-child td{ border-bottom:none; }
  .ptable td strong{ color:var(--accent-strong); }
  .ptable-wrap{ overflow-x:auto; }

  .analogy{ background:var(--surface-2); border-radius:12px; padding:16px 18px; margin:14px 0 20px; font-size:14.5px; color:var(--ink-soft); }
  .analogy b{color:var(--accent-strong); font-weight:600;}

  .qa-fam{ margin:28px 0 12px; font-family:var(--font-mono); font-size:11.5px; font-weight:600; letter-spacing:.05em; color:var(--accent-strong); padding-bottom:8px; border-bottom:1px solid var(--line); }
  .qa-fam:first-of-type{ margin-top:6px; }
  .qa-item{ border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:18px 20px; margin:0 0 14px; box-shadow:var(--shadow); scroll-margin-top:24px; }
  .qa-tag{ display:inline-block; font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); padding:2px 9px; border-radius:5px; margin-bottom:9px; }
  .qa-q{ margin:0 0 10px; font-size:15px; font-weight:600; color:var(--ink); }
  .qa-a{ margin:0; font-size:14px; color:var(--ink-soft); }
  .qa-a strong{ color:var(--accent-strong); }
  .qa-a + .qa-a{ margin-top:8px; }
  .qa-follow{ margin-top:12px; padding:12px 14px; border-radius:8px; background:var(--accent-teal-soft); font-size:13.5px; }
  .qa-flabel{ display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-teal); margin-bottom:6px; font-weight:600; }
  .qa-follow .fq{ margin:0 0 6px; font-weight:600; color:var(--ink); }
  .qa-follow .fa{ margin:0; color:var(--ink-soft); }

  .divider-note{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-faint); margin:26px 0; }
  .divider-note::before, .divider-note::after{content:""; flex:1; height:1px; background:var(--line);}

  .codebox{ background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:13px 15px; margin:10px 0; overflow-x:auto; }
  .codebox .path{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-bottom:9px; }
  .codebox .path a{ color:var(--ink-faint); text-decoration:none; border-bottom:1px dashed var(--line); }
  .codebox .path a:hover{ color:var(--accent-teal); border-color:var(--accent-teal); }
  .codebox pre{ margin:0; font-family:var(--font-mono); font-size:12px; line-height:1.65; color:var(--ink); white-space:pre; }
  .codebox .out{ margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-faint); white-space:pre-wrap; font-family:var(--font-mono); }

  .deeper{ background:var(--accent-teal-soft); border:1px solid var(--accent-teal); border-radius:14px; padding:20px 22px; margin:34px 0; }
  .deeper .dl{ font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-teal); margin-bottom:8px; }
  .deeper a{ color:var(--accent-teal); font-weight:600; }
  .deeper .note{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; }

  footer{ border-top:1px solid var(--line); padding-top:28px; margin-top:16px; font-size:13px; color:var(--ink-faint); }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

  <script>
  (function(){
    var KEY = "unlocked-book-agent-era-ai-system-design"; // 이 책 전체가 공유하는 키 — 장마다 다시 안 물어봄
    var ITER = 250000;
    var payload = JSON.parse(document.getElementById("lockedPayload").textContent);
    var opened = false;

    function bytes(b64){
      var bin = atob(b64), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function decrypt(pass){
      var enc = new TextEncoder();
      return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
        .then(function(base){
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: bytes(payload.salt), iterations: ITER, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        })
        .then(function(key){
          return crypto.subtle.decrypt(
            { name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.data));
        })
        .then(function(buf){ return new TextDecoder().decode(buf); });
    }

    // innerHTML로 넣은 <script>는 실행되지 않으므로 다시 만들어 붙인다.
    function runScripts(root){
      var list = Array.prototype.slice.call(root.querySelectorAll("script"));
      list.forEach(function(old){
        var s = document.createElement("script");
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    }

    function reveal(html){
      if (opened) return;
      opened = true;
      var holder = document.createElement("div");
      holder.innerHTML = html;
      var page = holder.querySelector("#pageContent");
      if (page) page.style.display = "";
      while (holder.firstChild) document.body.appendChild(holder.firstChild);
      runScripts(document.body);
      var gate = document.getElementById("lockGate");
      if (gate) gate.parentNode.removeChild(gate);
    }

    function tryPass(pass, onFail){
      decrypt(pass).then(function(html){
        try { sessionStorage.setItem(KEY, pass); } catch(e){}
        reveal(html);
      }).catch(function(){ if (onFail) onFail(); });
    }

    document.addEventListener("DOMContentLoaded", function(){
      var saved = null;
      try { saved = sessionStorage.getItem(KEY); } catch(e){}
      if (saved) tryPass(saved);

      function submit(){
        var v = document.getElementById("lockInput").value;
        tryPass(v, function(){
          document.getElementById("lockError").style.display = "block";
        });
      }
      document.getElementById("lockBtn").addEventListener("click", submit);
      document.getElementById("lockInput").addEventListener("keydown", function(ev){
        if (ev.key === "Enter") submit();
      });
    });
  })();
  </script>
